# ==============================================================================
# GYM MANAGEMENT SYSTEM - SPRING BOOT CONFIGURATION
# DBMS Mini-Project (MySQL 8.0 + Spring Data JPA)
# ==============================================================================

server.port=8080
server.servlet.context-path=/

# ------------------------------------------------------------------------------
# MySQL 8.0 Database Connection
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/gym_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# Change these credentials to match your local MySQL Server installation:
spring.datasource.username=root
spring.datasource.password=ajay

# ------------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ------------------------------------------------------------------------------
# update: Automatically validates and updates schema while preserving your data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Keep naming physical strategy aligned with snake_case MySQL table & column names
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ------------------------------------------------------------------------------
# Static Resources Configuration (Serves Frontend directly from http://localhost:8080)
# ------------------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/,file:frontend/,file:../frontend/

# Jackson JSON Formatter
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata
